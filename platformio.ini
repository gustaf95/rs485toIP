; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 기본 타겟은 ESP32-C3 Super Mini다. 기존 ESP32 보드로 빌드하려면
;   pio run -e esp32dev
default_envs = esp32c3_supermini

; **빌드 산출물을 프로젝트 밖(ASCII 경로)에 둔다.**
;
; 이 프로젝트는 한글이 섞인 경로(Google Drive 동기화 폴더)에 있는데, ESP32-C3용
; RISC-V 툴체인의 링커(binutils/GCC 8.4.0)가 non-ASCII 경로를 깨뜨린다:
;
;   ld.exe: cannot open map file H:/?? ????????/...: No such file or directory
;
; 컴파일까지는 멀쩡히 되고 **링크에서만** 터진다. ESP32 클래식용 Xtensa 툴체인은 같은
; 경로에서 문제없이 링크되므로, 이걸 안 걸어두면 "클래식은 되는데 C3만 안 되는" 상태가
; 되어 원인을 코드에서 찾게 된다.
;
; 경로는 ASCII이기만 하면 아무 데나 상관없다. 다른 곳에 두려면 이 줄을 고치거나
; PLATFORMIO_BUILD_DIR 환경변수로 덮어쓰면 된다.
;
; **슬래시 방향에 주의.** $PROJECT_CORE_DIR 같은 변수를 쓰면 Windows에서 역슬래시로
; 전개되는데, SCons가 그걸 상대 경로로 오인해 프로젝트 경로 뒤에 이어붙인다
; (\...\RS485toIP\C:\Users\... 꼴이 되어 Errno 22로 죽는다). 포워드 슬래시로 직접 적어야 한다.
build_dir = C:/pio-build/$PROJECT_HASH

; ---------------------------------------------------------------------------
; 두 보드가 공유하는 설정
; ---------------------------------------------------------------------------
; 보드마다 다른 것(어느 UART를 쓰는지, 기본 GPIO, 예약 핀 목록)은 빌드 플래그가 아니라
; src/BoardProfile.h가 칩 종류를 보고 정한다. 여기에는 툴체인 수준의 차이만 둔다.
[env]
platform = espressif32
framework = arduino

; USB 콘솔 속도. src/config.h의 SERIAL_CONSOLE_BAUD와 반드시 같아야 한다.
; (C3에서는 콘솔이 네이티브 USB CDC라 이 값이 무시된다 - 아래 주석 참고.)
monitor_speed = 115200

; web/control.html을 gzip PROGMEM 배열(src/generated/WebAssets.h)로 굽는다. 매 빌드마다
; 다시 만들므로 .html을 고치고 그냥 빌드하면 된다 (web/README.md 참고).
extra_scripts = pre:tools/embed_web.py

; 경고는 이 프로젝트의 소스에만 켠다. framework-arduinoespressif32도 함께 컴파일되는데
; 거기까지 켜면 우리가 못 고치는 경고가 수백 줄 쏟아져 정작 우리 코드의 경고가 묻힌다.
build_src_flags =
    -Wall
    -Wextra
    ; Arduino 코어 헤더가 필드 순서를 뒤섞어 초기화하는 곳이 있어 우리 코드와 무관하게 뜬다.
    -Wno-missing-field-initializers

; ---------------------------------------------------------------------------
; ESP32-C3 Super Mini (기본)
; ---------------------------------------------------------------------------
[env:esp32c3_supermini]
; PlatformIO에 "Super Mini" 보드 정의는 없다. 같은 ESP32-C3 + 4MB 플래시라
; DevKitM-1 정의가 그대로 맞는다 - 다른 것은 핀 헤더 배치뿐이고 그건 펌웨어가 아니라
; 배선의 문제다.
board = esp32-c3-devkitm-1

; **이 두 플래그가 없으면 Serial 메뉴가 USB로 보이지 않는다.**
; Super Mini의 USB-C는 CH340 같은 브리지 칩이 아니라 칩에 내장된 USB Serial/JTAG다.
; 이 플래그가 없으면 Arduino의 `Serial`이 UART0(GPIO20/21)로 가버려서, USB를 꽂아도
; 메뉴가 나오지 않고 그 핀에 물린 것만 받는다.
;
; CDC로 가면 보드레이트라는 개념이 사라진다 - monitor_speed도 SERIAL_CONSOLE_BAUD도
; 무시되고 속도는 USB가 정한다. Debug Mode 로그가 loop()를 붙잡던 문제(readme 3.1절)가
; 그래서 C3에서는 대체로 사라지는데, 터미널이 열린 채 읽어가지 않는 경우만 남아
; main.cpp setup()의 Serial.setTxTimeoutMs()로 상한을 둔다.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 네이티브 USB CDC는 DTR/RTS를 리셋 신호로 쓰지 않는다. 터미널이 그걸 토글하면
; 포트가 끊기거나 첫 줄이 잘리는 개체가 있어 꺼둔다.
monitor_rts = 0
monitor_dtr = 0

; ---------------------------------------------------------------------------
; ESP32 클래식 (기존 설치 장비)
; ---------------------------------------------------------------------------
; 남겨두는 이유는 이미 현장에 나가 있는 보드 때문이다. 이 브랜치의 변경은 전부
; BoardProfile.h를 통하므로 이쪽 동작은 그대로다 - 핀 기본값도, UART2도 바뀌지 않는다.
[env:esp32dev]
board = esp32dev
